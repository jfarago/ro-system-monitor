[platformio]
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
; The official espressif32 platform has no Arduino support for the C6 (core 2.x only).
; pioarduino provides Arduino core 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient
extra_scripts = pre:scripts/build_ui.py
test_ignore = test_counters

; Wireless upload: OTA_PASSWORD=<same as secrets.h> pio run -e ota -t upload
; (add -t uploadfs to push the UI). Needs the OTA firmware already on the board.
[env:ota]
extends = env:seeed_xiao_esp32c6
upload_protocol = espota
upload_port = ro-monitor.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}

; Development board on the same network: own hostname (ro-monitor-dev.local).
; MQTT is disabled in this build, so secrets.h can stay the same.
; USB: pio run -e dev -t upload   (and -t uploadfs)
[env:dev]
extends = env:seeed_xiao_esp32c6
build_flags =
    ${env:seeed_xiao_esp32c6.build_flags}
    -DDEV_BUILD

; Wireless: OTA_PASSWORD=<same as secrets.h> pio run -e dev_ota -t upload
[env:dev_ota]
extends = env:dev
upload_protocol = espota
upload_port = ro-monitor-dev.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}

; Host unit tests for the pure counter logic: pio test -e native
[env:native]
platform = native
build_src_filter = -<*> +<counters.cpp>
test_build_src = yes
build_flags = -DUNITY_INCLUDE_DOUBLE
